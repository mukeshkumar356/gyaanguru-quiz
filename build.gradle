plugins {
    id 'com.android.application' version '8.9.0' apply false
}

// Build output redirected outside OneDrive — OneDrive's real-time sync locks files
// inside app/build/intermediates during the build, causing random
// "Unable to delete directory" failures. See HashKit project for the same fix.
allprojects {
    buildDir = "C:/AndroidBuilds/GKQuizAndroid/${project.name}"
}
